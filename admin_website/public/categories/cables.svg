<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cableBraid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2d3d"/>
      <stop offset="50%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="metalRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="zincShell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="goldPin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="cableShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="neonRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#cableShadow)">
    <!-- Heavy-Duty Thick Coiled Nylon Braided Cable Wire Path -->
    <path d="M 120 370 C 40 370 40 220 140 200 C 240 180 260 340 370 320 C 450 305 450 170 380 160" fill="none" stroke="url(#cableBraid)" stroke-width="26" stroke-linecap="round"/>
    <path d="M 120 370 C 40 370 40 220 140 200 C 240 180 260 340 370 320 C 450 305 450 170 380 160" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.9" filter="url(#neonRed)"/>

    <!-- LEFT CONNECTOR HEAD (Type-C 1 - Red Metallic Alloy) -->
    <g transform="translate(60, 310) rotate(-45)">
      <!-- Strain Relief Boot -->
      <rect x="52" y="10" width="28" height="40" rx="6" fill="#090a0f" stroke="#ef4444" stroke-width="2"/>
      <line x1="56" y1="20" x2="76" y2="20" stroke="#ef4444" stroke-width="2"/>
      <line x1="56" y1="30" x2="76" y2="30" stroke="#ef4444" stroke-width="2"/>

      <!-- Aluminum Metal Connector Shell Body -->
      <rect x="44" y="46" width="44" height="64" rx="10" fill="url(#metalRed)" stroke="#fee2e2" stroke-width="2"/>
      <rect x="52" y="54" width="28" height="12" rx="4" fill="#ffffff" opacity="0.3"/>

      <!-- Gold-Plated USB-C Plug Head -->
      <rect x="50" y="110" width="32" height="32" rx="8" fill="url(#goldPin)" stroke="#ca8a04" stroke-width="2"/>
      <rect x="56" y="118" width="20" height="16" rx="4" fill="#090a0f"/>
    </g>

    <!-- RIGHT CONNECTOR HEAD (Type-C 2 - Red Metallic Alloy) -->
    <g transform="translate(380, 100) rotate(135)">
      <!-- Strain Relief Boot -->
      <rect x="52" y="10" width="28" height="40" rx="6" fill="#090a0f" stroke="#ef4444" stroke-width="2"/>
      <line x1="56" y1="20" x2="76" y2="20" stroke="#ef4444" stroke-width="2"/>
      <line x1="56" y1="30" x2="76" y2="30" stroke="#ef4444" stroke-width="2"/>

      <!-- Aluminum Metal Connector Shell Body -->
      <rect x="44" y="46" width="44" height="64" rx="10" fill="url(#metalRed)" stroke="#fee2e2" stroke-width="2"/>
      <rect x="52" y="54" width="28" height="12" rx="4" fill="#ffffff" opacity="0.3"/>

      <!-- Gold-Plated USB-C Plug Head -->
      <rect x="50" y="110" width="32" height="32" rx="8" fill="url(#goldPin)" stroke="#ca8a04" stroke-width="2"/>
      <rect x="56" y="118" width="20" height="16" rx="4" fill="#090a0f"/>
    </g>
  </g>
</svg>
