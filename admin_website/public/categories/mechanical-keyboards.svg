<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="kbBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24"/>
      <stop offset="50%" stop-color="#0f1118"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="redGlowKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="keyBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2d3d"/>
      <stop offset="100%" stop-color="#181a24"/>
    </linearGradient>
    <linearGradient id="redUnderglow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="30%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#ff4d4d"/>
      <stop offset="70%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="kbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="neonRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#kbShadow)">
    <!-- Base Board Chassis -->
    <rect x="46" y="126" width="420" height="260" rx="28" fill="url(#kbBody)" stroke="#374151" stroke-width="3"/>

    <!-- Bottom Red Underglow Accent Strip -->
    <rect x="66" y="372" width="380" height="6" rx="3" fill="url(#redUnderglow)" filter="url(#neonRed)"/>

    <!-- Key Matrix Grid Container -->
    <rect x="66" y="146" width="380" height="216" rx="16" fill="#090a0f" stroke="#1f2937" stroke-width="2"/>

    <!-- Row 1: Function/Number Row Keycaps -->
    <rect x="78" y="158" width="36" height="32" rx="6" fill="url(#keyBase)" stroke="#374151"/>
    <rect x="120" y="158" width="36" height="32" rx="6" fill="url(#keyBase)" stroke="#374151"/>
    <rect x="162" y="158" width="36" height="32" rx="6" fill="url(#keyBase)" stroke="#374151"/>
    <rect x="204" y="158" width="36" height="32" rx="6" fill="url(#keyBase)" stroke="#374151"/>
    <rect x="246" y="158" width="36" height="32" rx="6" fill="url(#keyBase)" stroke="#374151"/>
    <rect x="288" y="158" width="36" height="32" rx="6" fill="url(#keyBase)" stroke="#374151"/>
    <rect x="330" y="158" width="36" height="32" rx="6" fill="url(#keyBase)" stroke="#374151"/>
    <rect x="372" y="158" width="62" height="32" rx="6" fill="url(#redGlowKey)" stroke="#fca5a5" stroke-width="1.5" filter="url(#neonRed)"/>

    <!-- Row 2: Top Row (QWERTY) -->
    <rect x="78" y="196" width="46" height="34" rx="6" fill="#181a24" stroke="#374151"/>
    <rect x="130" y="196" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#374151"/>
    <!-- 'W' Key Highlight -->
    <rect x="172" y="196" width="36" height="34" rx="6" fill="url(#redGlowKey)" stroke="#fee2e2" stroke-width="2" filter="url(#neonRed)"/>
    <polygon points="190,205 183,220 197,220" fill="#ffffff"/>

    <rect x="214" y="196" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#374151"/>
    <rect x="256" y="196" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#374151"/>
    <rect x="298" y="196" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#374151"/>
    <rect x="340" y="196" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#374151"/>
    <rect x="382" y="196" width="52" height="34" rx="6" fill="#181a24" stroke="#374151"/>

    <!-- Row 3: Home Row (ASDF) -->
    <rect x="78" y="236" width="52" height="34" rx="6" fill="#181a24" stroke="#374151"/>
    <!-- 'A' Key Highlight -->
    <rect x="136" y="236" width="36" height="34" rx="6" fill="url(#redGlowKey)" stroke="#fee2e2" stroke-width="2" filter="url(#neonRed)"/>
    <polygon points="146,253 161,246 161,260" fill="#ffffff"/>

    <!-- 'S' Key Highlight -->
    <rect x="178" y="236" width="36" height="34" rx="6" fill="url(#redGlowKey)" stroke="#fee2e2" stroke-width="2" filter="url(#neonRed)"/>
    <polygon points="196,260 189,245 203,245" fill="#ffffff"/>

    <!-- 'D' Key Highlight -->
    <rect x="220" y="236" width="36" height="34" rx="6" fill="url(#redGlowKey)" stroke="#fee2e2" stroke-width="2" filter="url(#neonRed)"/>
    <polygon points="246,253 231,246 231,260" fill="#ffffff"/>

    <rect x="262" y="236" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#374151"/>
    <rect x="304" y="236" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#374151"/>
    <rect x="346" y="236" width="88" height="34" rx="6" fill="url(#redGlowKey)" stroke="#fee2e2" stroke-width="1.5"/>

    <!-- Row 4: Bottom Key Row (ZXCV) -->
    <rect x="78" y="276" width="64" height="34" rx="6" fill="#181a24" stroke="#374151"/>
    <rect x="148" y="276" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#374151"/>
    <rect x="190" y="276" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#374151"/>
    <rect x="232" y="276" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#374151"/>
    <rect x="274" y="276" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#374151"/>
    <rect x="316" y="276" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#374151"/>
    <rect x="358" y="276" width="76" height="34" rx="6" fill="#181a24" stroke="#ef4444"/>

    <!-- Row 5: Spacebar & Modifiers -->
    <rect x="78" y="316" width="42" height="34" rx="6" fill="#181a24" stroke="#374151"/>
    <rect x="126" y="316" width="42" height="34" rx="6" fill="#181a24" stroke="#374151"/>
    <!-- Spacebar -->
    <rect x="174" y="316" width="160" height="34" rx="8" fill="url(#keyBase)" stroke="#4b5563" stroke-width="2"/>
    <rect x="210" y="330" width="88" height="6" rx="3" fill="url(#redGlowKey)" filter="url(#neonRed)"/>

    <rect x="340" y="316" width="42" height="34" rx="6" fill="#181a24" stroke="#374151"/>
    <rect x="388" y="316" width="46" height="34" rx="6" fill="#181a24" stroke="#374151"/>
  </g>
</svg>
