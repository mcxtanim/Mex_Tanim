<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="chargerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2d3d"/>
      <stop offset="50%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#0d0e15"/>
    </linearGradient>
    <linearGradient id="frontPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="redNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="redPort" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="chargerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="neonRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#chargerShadow)">
    <!-- Metallic Wall Plug Prongs (Top) -->
    <rect x="186" y="50" width="24" height="70" rx="8" fill="#4b5563" stroke="#1f2937" stroke-width="3"/>
    <rect x="302" y="50" width="24" height="70" rx="8" fill="#4b5563" stroke="#1f2937" stroke-width="3"/>
    <circle cx="198" cy="74" r="5" fill="#ef4444"/>
    <circle cx="314" cy="74" r="5" fill="#ef4444"/>

    <!-- Main Adapter Chassis (Dark Matte Stealth Body) -->
    <rect x="120" y="106" width="272" height="320" rx="36" fill="url(#chargerBody)" stroke="#ef4444" stroke-width="3"/>

    <!-- Side Bevel Detail Line -->
    <path d="M 140 106 L 372 106" stroke="#ff4d4d" stroke-width="3" opacity="0.8"/>

    <!-- Front USB Output Port Faceplate (Dark Tech Plate) -->
    <rect x="156" y="270" width="200" height="126" rx="20" fill="url(#frontPlate)" stroke="#374151" stroke-width="2"/>

    <!-- Dual Type-C Ports with Glowing Red Outlines -->
    <!-- Type-C Port 1 -->
    <rect x="196" y="290" width="120" height="28" rx="14" fill="#090a0f" stroke="url(#redPort)" stroke-width="2"/>
    <rect x="216" y="300" width="80" height="8" rx="4" fill="url(#redPort)"/>

    <!-- Type-C Port 2 -->
    <rect x="196" y="340" width="120" height="28" rx="14" fill="#090a0f" stroke="url(#redPort)" stroke-width="2"/>
    <rect x="216" y="350" width="80" height="8" rx="4" fill="url(#redPort)"/>

    <!-- Fast Charging Glowing Red Lightning Bolt Symbol -->
    <g filter="url(#neonRed)">
      <polygon points="266,130 220,210 256,210 240,260 292,180 256,180" fill="url(#redNeon)" stroke="#fee2e2" stroke-width="1.5"/>
    </g>

    <!-- LED Status Power Indicator Dot -->
    <circle cx="256" cy="410" r="5" fill="#ef4444" filter="url(#neonRed)"/>
  </g>
</svg>
