<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="headbandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2d3d"/>
      <stop offset="50%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="redNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="headsetShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="neonRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#headsetShadow)">
    <!-- Outer Metallic Headband Arch -->
    <path d="M 120 280 C 120 120 180 60 256 60 C 332 60 392 120 392 280" fill="none" stroke="url(#headbandGrad)" stroke-width="28" stroke-linecap="round"/>
    <path d="M 130 270 C 130 135 185 76 256 76 C 327 76 382 135 382 270" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>

    <!-- Soft Inner Cushioned Headband Pad -->
    <path d="M 155 210 C 170 125 205 92 256 92 C 307 92 342 125 357 210" fill="none" stroke="#090a0f" stroke-width="22" stroke-linecap="round"/>
    <path d="M 170 190 C 182 135 212 104 256 104 C 300 104 330 135 342 190" fill="none" stroke="url(#redNeon)" stroke-width="4" stroke-linecap="round" opacity="0.9" filter="url(#neonRed)"/>

    <!-- Left Fork Hanger -->
    <path d="M 116 260 L 116 320" stroke="#4b5563" stroke-width="12" stroke-linecap="round"/>
    <rect x="108" y="270" width="16" height="24" rx="4" fill="#181a24" stroke="#6b7280"/>

    <!-- Right Fork Hanger -->
    <path d="M 396 260 L 396 320" stroke="#4b5563" stroke-width="12" stroke-linecap="round"/>
    <rect x="388" y="270" width="16" height="24" rx="4" fill="#181a24" stroke="#6b7280"/>

    <!-- Left Earcup Cushion Base -->
    <rect x="70" y="300" width="80" height="120" rx="36" fill="#090a0f" stroke="#2a2d3d" stroke-width="4"/>
    <rect x="82" y="312" width="56" height="96" rx="26" fill="#181a24"/>
    <!-- Left RGB Light Ring -->
    <rect x="94" y="324" width="32" height="72" rx="16" fill="none" stroke="url(#redNeon)" stroke-width="4" filter="url(#neonRed)"/>

    <!-- Right Earcup Cushion Base -->
    <rect x="362" y="300" width="80" height="120" rx="36" fill="#090a0f" stroke="#2a2d3d" stroke-width="4"/>
    <rect x="374" y="312" width="56" height="96" rx="26" fill="#181a24"/>
    <!-- Right RGB Light Ring -->
    <rect x="386" y="324" width="32" height="72" rx="16" fill="none" stroke="url(#redNeon)" stroke-width="4" filter="url(#neonRed)"/>

    <!-- Center Earcup Metallic Accents -->
    <circle cx="110" cy="360" r="12" fill="url(#redNeon)" filter="url(#neonRed)"/>
    <circle cx="402" cy="360" r="12" fill="url(#redNeon)" filter="url(#neonRed)"/>

    <!-- Flexible Boom Microphone Arm -->
    <path d="M 120 400 C 120 460 180 470 230 465" fill="none" stroke="#181a24" stroke-width="8" stroke-linecap="round"/>
    <path d="M 120 400 C 120 460 180 470 230 465" fill="none" stroke="url(#redNeon)" stroke-width="3" stroke-linecap="round" filter="url(#neonRed)"/>

    <!-- Microphone Capsule Head -->
    <rect x="230" y="452" width="36" height="24" rx="12" fill="#090a0f" stroke="#ef4444" stroke-width="2"/>
    <circle cx="258" cy="464" r="5" fill="#ef4444" filter="url(#neonRed)"/>
  </g>
</svg>
