<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="trimmerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2d3d"/>
      <stop offset="50%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#0d0e15"/>
    </linearGradient>
    <linearGradient id="steelBlade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="trimmerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="neonRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#trimmerShadow)" transform="translate(10, 0) rotate(15 256 256)">
    <!-- Stainless Steel Precision T-Blade Head (Top) -->
    <!-- Blade Teeth Comb -->
    <path d="M 186 60 L 326 60 L 336 90 L 176 90 Z" fill="url(#steelBlade)" stroke="#ef4444" stroke-width="2"/>
    <line x1="194" y1="60" x2="194" y2="78" stroke="#ef4444" stroke-width="3"/>
    <line x1="206" y1="60" x2="206" y2="78" stroke="#ef4444" stroke-width="3"/>
    <line x1="218" y1="60" x2="218" y2="78" stroke="#ef4444" stroke-width="3"/>
    <line x1="230" y1="60" x2="230" y2="78" stroke="#ef4444" stroke-width="3"/>
    <line x1="242" y1="60" x2="242" y2="78" stroke="#ef4444" stroke-width="3"/>
    <line x1="254" y1="60" x2="254" y2="78" stroke="#ef4444" stroke-width="3"/>
    <line x1="266" y1="60" x2="266" y2="78" stroke="#ef4444" stroke-width="3"/>
    <line x1="278" y1="60" x2="278" y2="78" stroke="#ef4444" stroke-width="3"/>
    <line x1="290" y1="60" x2="290" y2="78" stroke="#ef4444" stroke-width="3"/>
    <line x1="302" y1="60" x2="302" y2="78" stroke="#ef4444" stroke-width="3"/>
    <line x1="314" y1="60" x2="314" y2="78" stroke="#ef4444" stroke-width="3"/>

    <!-- Blade Base Mount Neck -->
    <path d="M 200 90 L 312 90 L 296 140 L 216 140 Z" fill="#181a24" stroke="#ef4444" stroke-width="2"/>
    <circle cx="256" cy="115" r="8" fill="#ef4444" filter="url(#neonRed)"/>

    <!-- Ergonomic Main Handle Body Wand -->
    <path d="M 216 140 C 210 220 200 320 220 440 C 225 460 287 460 292 440 C 312 320 302 220 296 140 Z" fill="url(#trimmerBody)" stroke="#ef4444" stroke-width="3"/>

    <!-- Side Grip Metallic Accents -->
    <path d="M 216 180 C 220 260 216 340 228 400" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.9" filter="url(#neonRed)"/>
    <path d="M 296 180 C 292 260 296 340 284 400" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.9" filter="url(#neonRed)"/>

    <!-- Power Toggle Switch Button -->
    <rect x="238" y="220" width="36" height="56" rx="18" fill="#090a0f" stroke="#ef4444" stroke-width="2"/>
    <circle cx="256" cy="238" r="12" fill="#ef4444" filter="url(#neonRed)"/>
    <path d="M 256 232 L 256 240" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Battery Level Bar Indicator LEDs (Red Dots) -->
    <g transform="translate(256, 320)">
      <rect x="-24" y="0" width="48" height="60" rx="10" fill="#090a0f" stroke="#374151" stroke-width="2"/>
      <rect x="-14" y="10" width="28" height="6" rx="3" fill="#ef4444" filter="url(#neonRed)"/>
      <rect x="-14" y="22" width="28" height="6" rx="3" fill="#ef4444" filter="url(#neonRed)"/>
      <rect x="-14" y="34" width="28" height="6" rx="3" fill="#ef4444" filter="url(#neonRed)"/>
      <rect x="-14" y="46" width="28" height="6" rx="3" fill="#ef4444" filter="url(#neonRed)"/>
    </g>

    <!-- Bottom Charging Port Base -->
    <path d="M 226 440 L 286 440 L 276 465 L 236 465 Z" fill="#090a0f" stroke="#374151" stroke-width="2"/>
  </g>
</svg>
