<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="coolerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="fanBlades" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <filter id="coolerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#coolerShadow)">
    <!-- Outer Circular Housing / Clip Arms -->
    <rect x="76" y="226" width="60" height="60" rx="14" fill="#334155" stroke="#06b6d4" stroke-width="2"/>
    <rect x="376" y="226" width="60" height="60" rx="14" fill="#334155" stroke="#06b6d4" stroke-width="2"/>

    <!-- Main Cooling Unit Outer Hexagon/Circle -->
    <circle cx="256" cy="256" r="170" fill="url(#coolerBody)" stroke="#06b6d4" stroke-width="4"/>
    <circle cx="256" cy="256" r="150" fill="#090d16" stroke="#1e293b" stroke-width="3"/>

    <!-- RGB Ring -->
    <circle cx="256" cy="256" r="142" stroke="url(#cyanNeon)" stroke-width="4" filter="url(#neonCyan)" opacity="0.85"/>

    <!-- Cooling Fan Blades -->
    <g transform="rotate(0 256 256)">
      <!-- 7 Curved Blades -->
      <path d="M 256 256 Q 290 190 270 140 Q 240 180 256 256" fill="url(#fanBlades)" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 256 256 Q 340 230 365 190 Q 315 210 256 256" fill="url(#fanBlades)" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 256 256 Q 340 300 355 350 Q 305 320 256 256" fill="url(#fanBlades)" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 256 256 Q 280 345 256 372 Q 240 325 256 256" fill="url(#fanBlades)" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 256 256 Q 190 330 160 345 Q 185 305 256 256" fill="url(#fanBlades)" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 256 256 Q 165 260 147 215 Q 190 235 256 256" fill="url(#fanBlades)" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M 256 256 Q 200 185 200 145 Q 230 195 256 256" fill="url(#fanBlades)" stroke="#38bdf8" stroke-width="1.5"/>
    </g>

    <!-- Center Fan Motor Hub & Semiconductor Plate -->
    <circle cx="256" cy="256" r="48" fill="url(#coolerBody)" stroke="#06b6d4" stroke-width="3"/>
    <circle cx="256" cy="256" r="32" fill="#0284c7" filter="url(#neonCyan)" opacity="0.4"/>
    
    <!-- Snowflake / Frost Icon in Center -->
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
      <line x1="256" y1="238" x2="256" y2="274"/>
      <line x1="238" y1="256" x2="274" y2="256"/>
      <line x1="243" y1="243" x2="269" y2="269"/>
      <line x1="243" y1="269" x2="269" y2="243"/>
    </g>
  </g>
</svg>
