<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sleeveDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1f2937" />
      <stop offset="50%" stopColor="#111827" />
      <stop offset="100%" stopColor="#030712" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Left Sleeve -->
  <g filter="url(#shadow)">
    <path d="M120 180 C110 210, 105 260, 108 280 L162 280 C165 260, 160 210, 150 180 C145 165, 125 165, 120 180 Z" fill="url(#sleeveDark)" stroke="#374151" stroke-width="2"/>
    <path d="M115 200 Q135 205 155 200 M112 220 Q135 225 158 220 M110 240 Q135 245 160 240 M109 260 Q135 265 161 260" stroke="#374151" stroke-width="1" stroke-dasharray="2,3" fill="none" opacity="0.4"/>
    
    <!-- Luminous Glowing Green Logo Badge -->
    <circle cx="135" cy="235" r="16" fill="none" stroke="#22c55e" stroke-width="2.5" filter="url(#neonGlow)"/>
    <path d="M137 224 L130 234 L136 234 L133 246 L142 233 L136 233 Z" fill="#4ade80" filter="url(#neonGlow)"/>
    
    <!-- Dark Elastic Bottom Ring -->
    <rect x="107" y="278" width="56" height="8" rx="3" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  </g>

  <!-- Right Sleeve -->
  <g filter="url(#shadow)">
    <path d="M240 180 C230 210, 225 260, 228 280 L282 280 C285 260, 280 210, 270 180 C265 165, 245 165, 240 180 Z" fill="url(#sleeveDark)" stroke="#374151" stroke-width="2"/>
    <path d="M235 200 Q255 205 275 200 M232 220 Q255 225 278 220 M230 240 Q255 245 280 240 M229 260 Q255 265 281 260" stroke="#374151" stroke-width="1" stroke-dasharray="2,3" fill="none" opacity="0.4"/>
    
    <!-- Luminous Glowing Green Logo Badge -->
    <circle cx="255" cy="235" r="16" fill="none" stroke="#22c55e" stroke-width="2.5" filter="url(#neonGlow)"/>
    <path d="M257 224 L250 234 L256 234 L253 246 L262 233 L256 233 Z" fill="#4ade80" filter="url(#neonGlow)"/>
    
    <!-- Dark Elastic Bottom Ring -->
    <rect x="227" y="278" width="56" height="8" rx="3" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  </g>
</svg>
