<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cableBraid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="metalOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="zincShell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldPin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="cableShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#cableShadow)">
    <!-- Heavy-Duty Thick Coiled Nylon Braided Cable Wire Path -->
    <path d="M 120 370 C 40 370 40 220 140 200 C 240 180 260 340 370 320 C 450 305 450 170 380 160" fill="none" stroke="url(#cableBraid)" stroke-width="26" stroke-linecap="round"/>
    <path d="M 120 370 C 40 370 40 220 140 200 C 240 180 260 340 370 320 C 450 305 450 170 380 160" fill="none" stroke="#818cf8" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.6"/>

    <!-- LEFT CONNECTOR HEAD (Type-C 1 - Orange Metallic Alloy) -->
    <g transform="translate(60, 310) rotate(-45)">
      <!-- Strain Relief Boot -->
      <rect x="52" y="10" width="28" height="40" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
      <line x1="56" y1="20" x2="76" y2="20" stroke="#3f3f46" stroke-width="2"/>
      <line x1="56" y1="30" x2="76" y2="30" stroke="#3f3f46" stroke-width="2"/>

      <!-- Aluminum Metal Connector Shell Body -->
      <rect x="44" y="46" width="44" height="64" rx="10" fill="url(#metalOrange)" stroke="#ffedd5" stroke-width="2"/>
      <rect x="52" y="54" width="28" height="12" rx="4" fill="#ffffff" opacity="0.3"/>

      <!-- Gold-Plated USB-C Plug Head -->
      <rect x="50" y="110" width="32" height="32" rx="8" fill="url(#goldPin)" stroke="#ca8a04" stroke-width="2"/>
      <rect x="56" y="118" width="20" height="16" rx="4" fill="#090d16"/>
    </g>

    <!-- RIGHT CONNECTOR HEAD (Type-C 2 - Zinc Dark Metal Alloy) -->
    <g transform="translate(380, 100) rotate(135)">
      <!-- Strain Relief Boot -->
      <rect x="52" y="10" width="28" height="40" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
      <line x1="56" y1="20" x2="76" y2="20" stroke="#3f3f46" stroke-width="2"/>
      <line x1="56" y1="30" x2="76" y2="30" stroke="#3f3f46" stroke-width="2"/>

      <!-- Aluminum Metal Connector Shell Body -->
      <rect x="44" y="46" width="44" height="64" rx="10" fill="url(#metalOrange)" stroke="#ffedd5" stroke-width="2"/>
      <rect x="52" y="54" width="28" height="12" rx="4" fill="#ffffff" opacity="0.3"/>

      <!-- Gold-Plated USB-C Plug Head -->
      <rect x="50" y="110" width="32" height="32" rx="8" fill="url(#goldPin)" stroke="#ca8a04" stroke-width="2"/>
      <rect x="56" y="118" width="20" height="16" rx="4" fill="#090d16"/>
    </g>
  </g>
</svg>
