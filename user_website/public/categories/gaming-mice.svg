<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="mouseBody" x1="256" y1="40" x2="256" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2d3d"/>
      <stop offset="50%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#0d0e15"/>
    </linearGradient>
    <linearGradient id="mouseSide" x1="120" y1="200" x2="392" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b3e52"/>
      <stop offset="100%" stop-color="#12131a"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="wheelGlow" x1="256" y1="100" x2="256" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="neonRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Base Shadow Platform -->
    <ellipse cx="256" cy="450" rx="150" ry="24" fill="#000000" opacity="0.4"/>

    <!-- Mouse Outer Body Silhouette -->
    <path d="M 256 50 C 180 50 130 110 120 230 C 112 320 135 440 256 460 C 377 440 400 320 392 230 C 382 110 332 50 256 50 Z" fill="url(#mouseBody)" stroke="#374151" stroke-width="3"/>

    <!-- Left & Right Click Split Plates -->
    <path d="M 256 50 C 205 50 148 85 136 195 C 135 205 145 215 155 215 L 246 215 C 251 215 254 210 254 205 L 254 50 Z" fill="url(#mouseSide)"/>
    <path d="M 256 50 C 307 50 364 85 376 195 C 377 205 367 215 357 215 L 266 215 C 261 215 258 210 258 205 L 258 50 Z" fill="url(#mouseSide)"/>

    <!-- Left & Right Click Bevel Lines -->
    <path d="M 140 190 C 150 110 195 65 248 55" stroke="#4b5563" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 372 190 C 362 110 317 65 264 55" stroke="#4b5563" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Center Scroll Wheel Well -->
    <rect x="242" y="90" width="28" height="95" rx="14" fill="#090a0f" stroke="#27272a" stroke-width="2"/>

    <!-- Illuminated Scroll Wheel -->
    <rect x="247" y="105" width="18" height="50" rx="9" fill="url(#wheelGlow)" filter="url(#neonRed)"/>
    <rect x="250" y="112" width="12" height="6" rx="3" fill="#ffffff" opacity="0.8"/>
    <rect x="250" y="127" width="12" height="6" rx="3" fill="#ffffff" opacity="0.8"/>
    <rect x="250" y="142" width="12" height="6" rx="3" fill="#ffffff" opacity="0.8"/>

    <!-- DPI Switch Button -->
    <path d="M 246 200 L 266 200 L 262 230 L 250 230 Z" fill="#18181b" stroke="url(#redGlow)" stroke-width="2"/>
    <polygon points="256,206 251,216 261,216" fill="#ef4444"/>

    <!-- Side Grip Textures (Left) -->
    <path d="M 125 250 C 122 280 126 310 135 340" stroke="url(#redGlow)" stroke-width="4" stroke-linecap="round" filter="url(#neonRed)"/>
    <line x1="125" y1="270" x2="137" y2="275" stroke="#ef4444" stroke-width="2" opacity="0.8"/>
    <line x1="123" y1="290" x2="136" y2="295" stroke="#ef4444" stroke-width="2" opacity="0.8"/>
    <line x1="125" y1="310" x2="139" y2="315" stroke="#ef4444" stroke-width="2" opacity="0.8"/>

    <!-- Side Grip Textures (Right) -->
    <path d="M 387 250 C 390 280 386 310 377 340" stroke="url(#redGlow)" stroke-width="4" stroke-linecap="round" filter="url(#neonRed)"/>
    <line x1="387" y1="270" x2="375" y2="275" stroke="#ef4444" stroke-width="2" opacity="0.8"/>
    <line x1="389" y1="290" x2="376" y2="295" stroke="#ef4444" stroke-width="2" opacity="0.8"/>
    <line x1="387" y1="310" x2="373" y2="315" stroke="#ef4444" stroke-width="2" opacity="0.8"/>

    <!-- Side Thumb Buttons -->
    <path d="M 122 215 Q 115 240 120 260 L 128 255 Q 125 240 128 220 Z" fill="#ef4444"/>

    <!-- Palm RGB Aesthetic Line Curves -->
    <path d="M 190 330 C 210 380 302 380 322 330" fill="none" stroke="url(#redGlow)" stroke-width="4" stroke-linecap="round" filter="url(#neonRed)"/>
    <path d="M 210 360 C 230 410 282 410 302 360" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.6"/>

    <!-- Geometric Gaming Emblem (No Text) -->
    <g transform="translate(256, 305)">
      <polygon points="0,-18 16,8 0,4 -16,8" fill="url(#redGlow)" filter="url(#neonRed)"/>
      <polygon points="0,-10 9,6 0,3 -9,6" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>
</svg>
