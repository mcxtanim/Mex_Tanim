<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="kbBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wasdGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="keyBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="rgbStrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="33%" stop-color="#3b82f6"/>
      <stop offset="66%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="kbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowOrange">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#kbShadow)">
    <!-- Base Board Chassis -->
    <rect x="46" y="126" width="420" height="260" rx="28" fill="url(#kbBody)" stroke="#475569" stroke-width="4"/>

    <!-- Bottom RGB Underglow Accent Strip -->
    <rect x="66" y="372" width="380" height="6" rx="3" fill="url(#rgbStrip)"/>

    <!-- Key Matrix Grid Container -->
    <rect x="66" y="146" width="380" height="216" rx="16" fill="#090d16" stroke="#1e293b" stroke-width="2"/>

    <!-- Row 1: Function/Number Row Keycaps -->
    <rect x="78" y="158" width="36" height="32" rx="6" fill="url(#keyBase)" stroke="#475569"/>
    <rect x="120" y="158" width="36" height="32" rx="6" fill="url(#keyBase)" stroke="#475569"/>
    <rect x="162" y="158" width="36" height="32" rx="6" fill="url(#keyBase)" stroke="#475569"/>
    <rect x="204" y="158" width="36" height="32" rx="6" fill="url(#keyBase)" stroke="#475569"/>
    <rect x="246" y="158" width="36" height="32" rx="6" fill="url(#keyBase)" stroke="#475569"/>
    <rect x="288" y="158" width="36" height="32" rx="6" fill="url(#keyBase)" stroke="#475569"/>
    <rect x="330" y="158" width="36" height="32" rx="6" fill="url(#keyBase)" stroke="#475569"/>
    <rect x="372" y="158" width="62" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Row 2: Top Row (QWERTY) -->
    <rect x="78" y="196" width="46" height="34" rx="6" fill="#1e293b" stroke="#475569"/>
    <rect x="130" y="196" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#475569"/>
    <!-- 'W' Key Highlight -->
    <rect x="172" y="196" width="36" height="34" rx="6" fill="url(#wasdGlow)" stroke="#ffedd5" stroke-width="2" filter="url(#glowOrange)"/>
    <polygon points="190,205 183,220 197,220" fill="#ffffff"/>

    <rect x="214" y="196" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#475569"/>
    <rect x="256" y="196" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#475569"/>
    <rect x="298" y="196" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#475569"/>
    <rect x="340" y="196" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#475569"/>
    <rect x="382" y="196" width="52" height="34" rx="6" fill="#1e293b" stroke="#475569"/>

    <!-- Row 3: Home Row (ASDF) -->
    <rect x="78" y="236" width="52" height="34" rx="6" fill="#1e293b" stroke="#475569"/>
    <!-- 'A' Key Highlight -->
    <rect x="136" y="236" width="36" height="34" rx="6" fill="url(#wasdGlow)" stroke="#ffedd5" stroke-width="2" filter="url(#glowOrange)"/>
    <polygon points="146,253 161,246 161,260" fill="#ffffff"/>

    <!-- 'S' Key Highlight -->
    <rect x="178" y="236" width="36" height="34" rx="6" fill="url(#wasdGlow)" stroke="#ffedd5" stroke-width="2" filter="url(#glowOrange)"/>
    <polygon points="196,260 189,245 203,245" fill="#ffffff"/>

    <!-- 'D' Key Highlight -->
    <rect x="220" y="236" width="36" height="34" rx="6" fill="url(#wasdGlow)" stroke="#ffedd5" stroke-width="2" filter="url(#glowOrange)"/>
    <polygon points="246,253 231,246 231,260" fill="#ffffff"/>

    <rect x="262" y="236" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#475569"/>
    <rect x="304" y="236" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#475569"/>
    <rect x="346" y="236" width="88" height="34" rx="6" fill="url(#wasdGlow)" stroke="#ffedd5" stroke-width="1.5"/>

    <!-- Row 4: Bottom Key Row (ZXCV) -->
    <rect x="78" y="276" width="64" height="34" rx="6" fill="#1e293b" stroke="#475569"/>
    <rect x="148" y="276" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#475569"/>
    <rect x="190" y="276" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#475569"/>
    <rect x="232" y="276" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#475569"/>
    <rect x="274" y="276" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#475569"/>
    <rect x="316" y="276" width="36" height="34" rx="6" fill="url(#keyBase)" stroke="#475569"/>
    <rect x="358" y="276" width="76" height="34" rx="6" fill="#1e293b" stroke="#38bdf8"/>

    <!-- Row 5: Spacebar & Modifiers -->
    <rect x="78" y="316" width="42" height="34" rx="6" fill="#1e293b" stroke="#475569"/>
    <rect x="126" y="316" width="42" height="34" rx="6" fill="#1e293b" stroke="#475569"/>
    <!-- Spacebar -->
    <rect x="174" y="316" width="160" height="34" rx="8" fill="url(#keyBase)" stroke="#64748b" stroke-width="2"/>
    <rect x="210" y="330" width="88" height="6" rx="3" fill="url(#wasdGlow)" opacity="0.8"/>

    <rect x="340" y="316" width="42" height="34" rx="6" fill="#1e293b" stroke="#475569"/>
    <rect x="388" y="316" width="46" height="34" rx="6" fill="#1e293b" stroke="#475569"/>
  </g>
</svg>
