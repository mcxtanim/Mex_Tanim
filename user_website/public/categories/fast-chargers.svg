<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="chargerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="frontPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="amberBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="tealPort" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="chargerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="boltGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#chargerShadow)">
    <!-- Metallic Wall Plug Prongs (Top) -->
    <rect x="186" y="50" width="24" height="70" rx="8" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
    <rect x="302" y="50" width="24" height="70" rx="8" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
    <circle cx="198" cy="74" r="5" fill="#475569"/>
    <circle cx="314" cy="74" r="5" fill="#475569"/>

    <!-- Main Adapter Chassis (White Matte Gloss Body) -->
    <rect x="120" y="106" width="272" height="320" rx="36" fill="url(#chargerBody)" stroke="#cbd5e1" stroke-width="4"/>

    <!-- Side Bevel Detail Line -->
    <path d="M 140 106 L 372 106" stroke="#ffffff" stroke-width="4"/>

    <!-- Front USB Output Port Faceplate (Dark Tech Plate) -->
    <rect x="156" y="270" width="200" height="126" rx="20" fill="url(#frontPlate)" stroke="#334155" stroke-width="3"/>

    <!-- Dual Type-C Ports -->
    <!-- Type-C Port 1 -->
    <rect x="196" y="290" width="120" height="28" rx="14" fill="#090d16" stroke="url(#tealPort)" stroke-width="2"/>
    <rect x="216" y="300" width="80" height="8" rx="4" fill="url(#tealPort)"/>

    <!-- Type-C Port 2 -->
    <rect x="196" y="340" width="120" height="28" rx="14" fill="#090d16" stroke="url(#tealPort)" stroke-width="2"/>
    <rect x="216" y="350" width="80" height="8" rx="4" fill="url(#tealPort)"/>

    <!-- Fast Charging Lightning Bolt Symbol -->
    <g filter="url(#boltGlow)">
      <polygon points="266,130 220,210 256,210 240,260 292,180 256,180" fill="url(#amberBolt)" stroke="#fef08a" stroke-width="2"/>
    </g>

    <!-- LED Status Power Indicator Dot -->
    <circle cx="256" cy="410" r="5" fill="#22c55e"/>
  </g>
</svg>
