<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="headbandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="purpleNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="headsetShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowPurple">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#headsetShadow)">
    <!-- Outer Metallic Headband Arch -->
    <path d="M 120 280 C 120 120 180 60 256 60 C 332 60 392 120 392 280" fill="none" stroke="url(#headbandGrad)" stroke-width="28" stroke-linecap="round"/>
    <path d="M 130 270 C 130 135 185 76 256 76 C 327 76 382 135 382 270" fill="none" stroke="#3f3f46" stroke-width="4" stroke-linecap="round"/>

    <!-- Soft Inner Cushioned Headband Pad -->
    <path d="M 155 210 C 170 125 205 92 256 92 C 307 92 342 125 357 210" fill="none" stroke="#18181b" stroke-width="22" stroke-linecap="round"/>
    <path d="M 170 190 C 182 135 212 104 256 104 C 300 104 330 135 342 190" fill="none" stroke="url(#purpleNeon)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <!-- Left Fork Hanger -->
    <path d="M 116 260 L 116 320" stroke="#52525b" stroke-width="12" stroke-linecap="round"/>
    <rect x="108" y="270" width="16" height="24" rx="4" fill="#27272a" stroke="#71717a"/>

    <!-- Right Fork Hanger -->
    <path d="M 396 260 L 396 320" stroke="#52525b" stroke-width="12" stroke-linecap="round"/>
    <rect x="388" y="270" width="16" height="24" rx="4" fill="#27272a" stroke="#71717a"/>

    <!-- Left Earcup Cushion Base -->
    <rect x="70" y="300" width="80" height="120" rx="36" fill="#09090b" stroke="#27272a" stroke-width="4"/>
    <rect x="82" y="312" width="56" height="96" rx="26" fill="#18181b"/>
    <!-- Left RGB Light Ring -->
    <rect x="94" y="324" width="32" height="72" rx="16" fill="none" stroke="url(#purpleNeon)" stroke-width="4" filter="url(#glowPurple)"/>

    <!-- Right Earcup Cushion Base -->
    <rect x="362" y="300" width="80" height="120" rx="36" fill="#09090b" stroke="#27272a" stroke-width="4"/>
    <rect x="374" y="312" width="56" height="96" rx="26" fill="#18181b"/>
    <!-- Right RGB Light Ring -->
    <rect x="386" y="324" width="32" height="72" rx="16" fill="none" stroke="url(#purpleNeon)" stroke-width="4" filter="url(#glowPurple)"/>

    <!-- Center Earcup Metallic Accents -->
    <circle cx="110" cy="360" r="12" fill="url(#purpleNeon)"/>
    <circle cx="402" cy="360" r="12" fill="url(#purpleNeon)"/>

    <!-- Flexible Boom Microphone Arm -->
    <path d="M 120 400 C 120 460 180 470 230 465" fill="none" stroke="#27272a" stroke-width="8" stroke-linecap="round"/>
    <path d="M 120 400 C 120 460 180 470 230 465" fill="none" stroke="url(#cyanNeon)" stroke-width="3" stroke-linecap="round"/>

    <!-- Microphone Capsule Head -->
    <rect x="230" y="452" width="36" height="24" rx="12" fill="#09090b" stroke="#3f3f46" stroke-width="2"/>
    <circle cx="258" cy="464" r="5" fill="#ef4444" filter="url(#glowPurple)"/>
  </g>
</svg>
