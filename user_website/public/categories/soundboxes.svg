<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="boxBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2d3d"/>
      <stop offset="50%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#0d0e15"/>
    </linearGradient>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181a24"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="bassCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <filter id="speakerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="neonRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#speakerShadow)">
    <!-- Passive Bass Radiator End Cap (Left) -->
    <rect x="70" y="156" width="36" height="200" rx="18" fill="url(#bassCap)" stroke="#ef4444" stroke-width="2"/>
    <ellipse cx="88" cy="256" rx="8" ry="70" fill="#090a0f"/>

    <!-- Passive Bass Radiator End Cap (Right) -->
    <rect x="406" y="156" width="36" height="200" rx="18" fill="url(#bassCap)" stroke="#ef4444" stroke-width="2"/>
    <ellipse cx="424" cy="256" rx="8" ry="70" fill="#090a0f"/>

    <!-- Main Cylindrical Speaker Body -->
    <rect x="96" y="146" width="320" height="220" rx="44" fill="url(#boxBody)" stroke="#ef4444" stroke-width="3"/>

    <!-- Honeycomb Speaker Grille Mesh Center Section -->
    <rect x="136" y="166" width="240" height="180" rx="30" fill="url(#meshGrad)" stroke="#991b1b" stroke-width="3"/>

    <!-- Grille Honeycomb Glowing Red Driver Underglow Pattern -->
    <g fill="#ef4444" opacity="0.85">
      <circle cx="160" cy="190" r="4"/><circle cx="190" cy="190" r="4"/><circle cx="220" cy="190" r="4"/><circle cx="256" cy="190" r="4"/><circle cx="290" cy="190" r="4"/><circle cx="320" cy="190" r="4"/><circle cx="350" cy="190" r="4"/>
      <circle cx="175" cy="210" r="4"/><circle cx="205" cy="210" r="4"/><circle cx="238" cy="210" r="4"/><circle cx="274" cy="210" r="4"/><circle cx="305" cy="210" r="4"/><circle cx="335" cy="210" r="4"/>
      <circle cx="160" cy="230" r="4"/><circle cx="190" cy="230" r="4"/><circle cx="220" cy="230" r="4"/><circle cx="256" cy="230" r="4"/><circle cx="290" cy="230" r="4"/><circle cx="320" cy="230" r="4"/><circle cx="350" cy="230" r="4"/>
      <circle cx="175" cy="256" r="4"/><circle cx="205" cy="256" r="4"/><circle cx="238" cy="256" r="4"/><circle cx="274" cy="256" r="4"/><circle cx="305" cy="256" r="4"/><circle cx="335" cy="256" r="4"/>
      <circle cx="160" cy="282" r="4"/><circle cx="190" cy="282" r="4"/><circle cx="220" cy="282" r="4"/><circle cx="256" cy="282" r="4"/><circle cx="290" cy="282" r="4"/><circle cx="320" cy="282" r="4"/><circle cx="350" cy="282" r="4"/>
      <circle cx="175" cy="305" r="4"/><circle cx="205" cy="305" r="4"/><circle cx="238" cy="305" r="4"/><circle cx="274" cy="305" r="4"/><circle cx="305" cy="305" r="4"/><circle cx="335" cy="305" r="4"/>
      <circle cx="160" cy="325" r="4"/><circle cx="190" cy="325" r="4"/><circle cx="220" cy="325" r="4"/><circle cx="256" cy="325" r="4"/><circle cx="290" cy="325" r="4"/><circle cx="320" cy="325" r="4"/><circle cx="350" cy="325" r="4"/>
    </g>

    <!-- Top Rubber Control Strip Buttons -->
    <path d="M 180 146 L 332 146" stroke="#991b1b" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Plus Volume Button Icon -->
    <path d="M 200 140 L 200 152 M 194 146 L 206 146" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Bluetooth Icon -->
    <path d="M 240 140 L 248 146 L 244 152 L 244 140 L 248 146 L 240 152" stroke="#ffffff" stroke-width="2.5" fill="none"/>

    <!-- Play/Pause Button Icon -->
    <polygon points="274,141 282,146 274,151" fill="#ffffff"/>

    <!-- Minus Volume Button Icon -->
    <line x1="310" y1="146" x2="322" y2="146" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Woven Lanyard Carrying Strap Loop (Right) -->
    <path d="M 436 210 C 490 200 490 310 436 300" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
    <path d="M 436 210 C 490 200 490 310 436 300" fill="none" stroke="#fee2e2" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
  </g>
</svg>
